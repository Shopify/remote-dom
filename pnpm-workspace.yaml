packages:
  - examples/*
  - packages/*

catalog:
  '@preact/signals': ^1.3.0
  '@preact/signals-core': ^1.8.0
  '@quilted/threads': ^3.0.0
  '@types/react-dom': ^18.3.0
  htm: ^3.1.1
  preact: ^10.23.0
  react: ^18.3.0
  react-dom: ^18.3.0
  # The kitchen-sink example intentionally stays on Vite 5. See its README.
  vite: ^8.0.0

# Allow only reviewed dependency lifecycle scripts.
allowBuilds:
  esbuild: true
strictDepBuilds: true

# Restrict dependency resolution to registry packages that have aged for seven days.
blockExoticSubdeps: true
minimumReleaseAge: 10080

# Reject recent releases whose npm publishing trust evidence has weakened.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
